<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>행성별 점프력 비교 실험실</title>
    <!-- Matter.js Physics Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <!-- Google Fonts for Cute Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="stars"></div>

    <!-- Control Panel (moved to power gauge location) -->
    <div class="control-panel">
        <h3>⚙️ 설정</h3>

        <div class="slider-container">
            <div class="slider-label">
                <span>무게</span>
                <span class="slider-value" id="weight-value">1.0x</span>
            </div>
            <input type="range" id="weight-slider" class="slider" min="0.5" max="2.0" step="0.1" value="1.0">
        </div>

        <div class="slider-container">
            <div class="slider-label">
                <span>점프력</span>
                <span class="slider-value" id="power-value">1.0x</span>
            </div>
            <input type="range" id="power-slider" class="slider" min="0.5" max="2.0" step="0.1" value="1.0">
        </div>
    </div>

    <h1>🚀 행성별 점프력 비교</h1>

    <div class="controls">
        <button class="planet-btn btn-earth active" onclick="setPlanet('earth')">
            🌏 지구<br><span class="gravity-val">(1.0g)</span>
        </button>
        <button class="planet-btn btn-mars" onclick="setPlanet('mars')">
            🔴 화성<br><span class="gravity-val">(0.38g)</span>
        </button>
        <button class="planet-btn btn-moon" onclick="setPlanet('moon')">
            🌕 달<br><span class="gravity-val">(0.16g)</span>
        </button>
    </div>

    <div class="main-container">
        <div id="canvas-container">
            <div class="current-height">0 cm</div>
            <div class="jump-btn-container">
                <button id="jump-btn" onmousedown="jump()" ontouchstart="jump()">점프!<br>Jump</button>
            </div>
        </div>

        <div class="jump-history">
            <h2>📊 점프 기록</h2>
            <div class="table-container">
                <table id="jump-table">
                    <thead>
                        <tr>
                            <th>행성</th>
                            <th>무게</th>
                            <th>파워</th>
                            <th>높이</th>
                        </tr>
                    </thead>
                    <tbody id="jump-table-body">
                        <tr>
                            <td colspan="4" style="text-align: center; color: #95a5a6;">점프 기록이 없습니다</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- External JavaScript -->
    <script src="script.js"></script>
</body>

</html>
